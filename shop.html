  document.querySelector("#linkButton");

  let arStarted = false;

  window.addEventListener("load", async () => {

  closeButton.style.display = "block";

  const mindarSystem =
  scene.systems["mindar-image-system"];

  if(mindarSystem){

    await mindarSystem.start();

    arStarted = true;

  }

  });

  // ===== 終了 =====

    closeButton.addEventListener(
    "click",
    async (event) => {

    event.stopPropagation();
    
    const mindarSystem =
    scene.systems["mindar-image-system"];

    if(mindarSystem){

      await mindarSystem.stop();

      arStarted = false;

    }

    scene.style.display =
    "none";

    location.href = "index.html";

    closeButton.style.display =
    "none";

    messageBox.style.display =
    "none";

    linkButton.style.display =
    "none";

  });

  // ===== 現在表示中ターゲット =====

  let activeTarget = null;
  
  // ===== 全体タイマー管理 =====

  let globalTypingTimeouts = [];
  
  // ===== 店舗生成 =====

  shops.forEach((shopData) => {

    const target =
    document.createElement("a-entity");

    target.setAttribute(
      "mindar-image-target",
      `targetIndex:${shopData.id}`
    );

    let plane;

    if(shopData.type === "video"){

      plane =
      document.createElement("a-video");

    } else {

      plane =
      document.createElement("a-plane");

    }

    plane.setAttribute(
      "src",
      `#${shopData.image}`
    );

    plane.setAttribute(
      "transparent",
      "true"
    );

    plane.setAttribute(
    "material",
    "transparent:true; shader: flat"
    );

    plane.setAttribute(
      "width",
      "0.8"
    );

    plane.setAttribute(
      "height",
      "1.2"
    );

    plane.setAttribute(
      "position",
      "0 0 0.01"
    );

    target.appendChild(plane);

    scene.appendChild(target);

    let started = false;

    let startTime = 0;

    // ===== タイプライター =====

    function typeWriter(
      text,
      callback,
      i = 0
    ){

      if(i <= text.length){

        messageBox.textContent =
        text.substring(0, i);

        const timeout = setTimeout(() => {
        
          typeWriter(
            text,
            callback,
            i + 1
          );
        
        }, 120);

globalTypingTimeouts.push(timeout);

      } else {

        if(callback){

          callback();

        }

      }

    }

    // ===== セリフ順表示 =====

    let messageIndex = 0;

    function showNextMessage(){

      if(
        messageIndex
        <
        shopData.messages.length
      ){

        typeWriter(

          shopData.messages[messageIndex],

          () => {

            messageIndex++;

            if(
              messageIndex
              <
              shopData.messages.length
            ){

              const timeout = setTimeout(() => {

              showNextMessage();

              }, 1500);

              globalTypingTimeouts.push(timeout);

            }

            else {

              linkButton.href =
              shopData.url;

              linkButton.style.display =
              "block";

            }

          }

        );

      }

    }

    // ===== マーカー認識 =====

    target.addEventListener(
      "targetFound",
      () => {

        if(activeTarget && activeTarget !== target) return;
        
        if(!arStarted) return;
        
        if(started) return;
        
        activeTarget = target;
        messageBox.style.display = "none";
        linkButton.style.display = "none";

        // 前回のセリフ処理を停止
        globalTypingTimeouts.forEach(timeout => clearTimeout(timeout));

        globalTypingTimeouts = [];

        messageBox.textContent = "";    
        
        started = true;
    
        startTime = Date.now();
    
        // ===== 動画再生 =====
    
        if(shopData.type === "video"){
    
          const video =
          document.querySelector(
            `#${shopData.image}`
          );
    
          if(video){
    
            video.play();
    
          }
    
        }
    
        if(shopData.type !== "video"){

          messageBox.style.display =
          "block";

        }
    
        linkButton.style.display =
        "none";
    
        if(shopData.type !== "video"){

          messageIndex = 0;

         showNextMessage();

        }
    
      }
    );

    // ===== マーカー外れ =====

    target.addEventListener(
      "targetLost",
      () => {


        // ===== 動画停止 =====

        if(shopData.type === "video"){

          const video =
          document.querySelector(
            `#${shopData.image}`
          );

          if(video){

            video.pause();

            video.currentTime = 0;

          }

        }        

      if(!started) return;

        started = false;
        activeTarget = null;

        messageBox.style.display =
        "none";

        linkButton.style.display =
        "none";

        globalTypingTimeouts.forEach(timeout => clearTimeout(timeout));

        globalTypingTimeouts = [];

        messageBox.textContent = "";


        const seconds = Math.floor(

          (Date.now() - startTime)

          / 1000

        );

        if(seconds <= 0) return;
        
        fetch(

          "https://script.google.com/macros/s/AKfycbyJ1Du5S-yQqG8ylXoq8i4g8YmzKlDtngqub1Sj07kiVJYb8b30HFVrvtaX6MTqL7Qf/exec",

          {

            method:"POST",

            body:JSON.stringify({

              shop:shopData.image,

              seconds:seconds,

              time:new Date().toLocaleString()

            })

          }

        );

      }
    );

  });
