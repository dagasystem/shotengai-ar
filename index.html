/* パーキング情報 */

#parkingButton{

  position:absolute;

  left:50%;

  top:78%;

  transform:translateX(-50%);

  border:none;

}

</style>
</head>

<body>

<img
id="bg"
src="menu.png">

<button
id="shopButton"
onclick="location.href='shop.html'">
</button>

<button
id="parkingButton"

</button>

</html>
