<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商店街AR案内</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
}

/* 吹き出し */

#messageBox{

  position:fixed;

  top:20%;

  left:50%;

  transform:translateX(-50%);

  background:white;

  color:black;

  padding:12px 20px;

  border-radius:20px;

  font-size:24px;

  font-weight:bold;

  z-index:999;

  min-width:260px;

  text-align:center;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

}

</style>

</head>

<body>

<!-- 吹き出し -->

<div id="messageBox"></div>

<a-scene
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
cursor="rayOrigin: mouse; fuse: false"
raycaster="objects: .clickable"
>

<a-assets>

<!-- 店主PNG -->
<img id="shop1" src="shop1.png">

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<a-entity mindar-image-target="targetIndex: 0">

<!-- 店主画像 -->

<a-plane
id="shop1btn"
class="clickable"
src="#shop1"
transparent="true"
material="transparent: true"
position="0 0 0"
width="0.8"
height="1.2">
</a-plane>

</a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

  // タップでURLへ

  const shop1 =
  document.querySelector("#shop1btn");

  shop1.addEventListener("click", () => {

    window.location.href =
    "https://www.iizuka-shotengai.com";

  });

  // セリフ

  const messages = [

    "ようこそ飯塚東町商店街に起こしなされた！",

    "商店街の各お店をご案内つかまつる！",

    "くわしくはこちらでござる！"

  ];

  const messageBox =
  document.querySelector("#messageBox");

  let messageIndex = 0;

  // タイプライター表示

  function typeWriter(text, callback, i = 0){

    if(i <= text.length){

      messageBox.innerHTML =
      text.substring(0, i);

      setTimeout(() => {

        typeWriter(text, callback, i + 1);

      }, 120);

    } else {

      if(callback){

        callback();

      }

    }

  }

  // 次のメッセージへ

  function showNextMessage(){

    if(messageIndex < messages.length){

      typeWriter(messages[messageIndex], () => {

        messageIndex++;

        // 最後のセリフなら停止

        if(messageIndex < messages.length){

          setTimeout(() => {

            showNextMessage();

          }, 1500);

        }

      });

    }

  }

  showNextMessage();

});

</script>

</body>
</html>
