<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>まちみっけ！</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
}

/* ===== スタート画面 ===== */

#startScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:9999;
}

#menuImage{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== スタート透明ボタン ===== */

#startButton{

  position:absolute;

  bottom:10%;

  left:50%;

  transform:translateX(-50%);

  width:320px;

  height:90px;

  background:rgba(255,255,255,0);

  border:none;

}

/* ===== 終了ボタン ===== */

#closeButton{

  position:fixed;

  top:20px;

  right:20px;

  z-index:9999;

  background:black;

  color:white;

  border:none;

  border-radius:999px;

  padding:12px 18px;

  font-size:18px;

  display:none;

}

/* ===== セリフ ===== */

#messageBox{

  position:fixed;

  top:12%;

  left:50%;

  transform:translateX(-50%);

  background:white;

  color:black;

  padding:14px 22px;

  border-radius:20px;

  font-size:24px;

  font-weight:bold;

  z-index:999;

  min-width:260px;

  text-align:center;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

  display:none;

}

/* ===== URLボタン ===== */

#linkButton{

  position:fixed;

  bottom:8%;

  left:50%;

  transform:translateX(-50%);

  background:#ff6600;

  color:white;

  padding:18px 28px;

  border-radius:999px;

  font-size:24px;

  font-weight:bold;

  z-index:999;

  text-decoration:none;

  display:none;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

}

</style>

</head>

<body>

<!-- ===== スタート画面 ===== -->

<div id="startScreen">

  <img
  id="menuImage"
  src="menu.png">

  <button id="startButton"></button>

</div>

<!-- ===== 終了ボタン ===== -->

<button id="closeButton">

終了

</button>

<!-- ===== セリフ ===== -->

<div id="messageBox"></div>

<!-- ===== URLボタン ===== -->

<a
id="linkButton"
href="#"
target="_blank">

くわしくはこちら

</a>

<!-- ===== AR ===== -->

<a-scene

id="scene"

mindar-image="imageTargetSrc: targets.mind;"

color-space="sRGB"

renderer="colorManagement: true, physicallyCorrectLights"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false"

style="display:none"

>

<!-- ===== 画像 ===== -->

<a-assets>

<img id="shop1" src="shop1.png">
<img id="shop2" src="shop2.png">
<img id="shop3" src="shop3.png">
<img id="shop4" src="shop4.png">
<img id="shop5" src="shop5.png">
<img id="shop6" src="shop6.png">
<img id="shop7" src="shop7.png">
<img id="shop8" src="shop8.png">
<img id="shop9" src="shop9.png">
<img id="shop10" src="shop10.png">

<img id="shop11" src="shop11.png">
<img id="shop12" src="shop12.png">
<img id="shop13" src="shop13.png">
<img id="shop14" src="shop14.png">
<img id="shop15" src="shop15.png">
<img id="shop16" src="shop16.png">
<img id="shop17" src="shop17.png">
<img id="shop18" src="shop18.png">
<img id="shop19" src="shop19.png">
<img id="shop20" src="shop20.png">

<img id="shop21" src="shop21.png">
<img id="shop22" src="shop22.png">
<img id="shop23" src="shop23.png">
<img id="shop24" src="shop24.png">
<img id="shop25" src="shop25.png">
<img id="shop26" src="shop26.png">
<img id="shop27" src="shop27.png">
<img id="shop28" src="shop28.png">
<img id="shop29" src="shop29.png">
<img id="shop30" src="shop30.png">

</a-assets>

<!-- ===== カメラ ===== -->

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

  // ===== 店舗データ =====

  const shops = [

    {
      id:0,
      image:"shop1",
      url:"https://example.com/1",

      messages:[
        "だがソフへようこそ！",
        "ソフトクリーム販売中！",
        "商店街を楽しんでね！"
      ]
    },

    {
      id:1,
      image:"shop2",
      url:"https://example.com/2",

      messages:[
    "ようこそ起こしなされた！",

    "私は、後ろの駄菓子屋の店主でござる！",

    "飯塚宿の紹介を少し",

    "飯塚宿は、長崎街道の宿場として",

    "大いに栄えし町にござる。",

    "異国渡りの砂糖が運ばれ、",

    "「シュガーロード」と呼ばれる",

    "菓子文化の道としても知られ、",

    "甘味文化が花開いた地でござる！",

    "今なお、その賑わいの名残は",

    "商店街に息づいておるのじゃ。",

    "それでは、",

    "商店街のお店をご案内つかまつる！",

      ]
    },

    {
      id:2,
      image:"shop3",
      url:"https://example.com/3",

      messages:[
        "Roseへようこそ！",
        "かわいい雑貨あります！",
        "ぜひ見ていってね！"
      ]
    },

    // ===== ここから30店舗まで追加可能 =====

  ];

  // ===== UI =====

  const startButton =
  document.querySelector("#startButton");

  const startScreen =
  document.querySelector("#startScreen");

  const scene =
  document.querySelector("#scene");

  const closeButton =
  document.querySelector("#closeButton");

  const messageBox =
  document.querySelector("#messageBox");

  const linkButton =
  document.querySelector("#linkButton");

  // ===== START =====

  startButton.addEventListener("click", async () => {

    startScreen.style.display =
    "none";

    scene.style.display =
    "block";

    closeButton.style.display =
    "block";

    const mindarSystem =
    scene.systems["mindar-image-system"];

    if(mindarSystem){

      await mindarSystem.start();

    }

  });

  // ===== 終了 =====

  closeButton.addEventListener("click", async () => {

    const mindarSystem =
    scene.systems["mindar-image-system"];

    if(mindarSystem){

      await mindarSystem.stop();

    }

    scene.style.display =
    "none";

    startScreen.style.display =
    "block";

    closeButton.style.display =
    "none";

    messageBox.style.display =
    "none";

    linkButton.style.display =
    "none";

  });

  // ===== 店舗生成 =====

  shops.forEach((shopData) => {

    // ===== マーカー =====

    const target =
    document.createElement("a-entity");

    target.setAttribute(
      "mindar-image-target",
      `targetIndex:${shopData.id}`
    );

    // ===== PNG =====

    const plane =
    document.createElement("a-plane");

    plane.setAttribute(
      "src",
      `#${shopData.image}`
    );

    plane.setAttribute(
      "transparent",
      "true"
    );

    plane.setAttribute(
      "material",
      "transparent:true"
    );

    // ===== サイズ =====

    plane.setAttribute(
      "width",
      "0.4"
    );

    plane.setAttribute(
      "height",
      "0.6"
    );

    // ===== 前へ =====

    plane.setAttribute(
      "position",
      "0 0 0.1"
    );

    target.appendChild(plane);

    scene.appendChild(target);

    // ===== 状態 =====

    let started = false;

    let startTime = 0;

    // ===== タイプライター =====

    function typeWriter(
      text,
      callback,
      i = 0
    ){

      if(i <= text.length){

        messageBox.innerHTML =
        text.substring(0, i);

        setTimeout(() => {

          typeWriter(
            text,
            callback,
            i + 1
          );

        }, 120);

      } else {

        if(callback){

          callback();

        }

      }

    }

    // ===== セリフ順表示 =====

    let messageIndex = 0;

    function showNextMessage(){

      if(
        messageIndex
        <
        shopData.messages.length
      ){

        typeWriter(

          shopData.messages[messageIndex],

          () => {

            messageIndex++;

            // ===== 次のセリフ =====

            if(
              messageIndex
              <
              shopData.messages.length
            ){

              setTimeout(() => {

                showNextMessage();

              }, 1500);

            }

            // ===== 全セリフ終了 =====

            else {

              linkButton.href =
              shopData.url;

              linkButton.style.display =
              "block";

            }

          }

        );

      }

    }

    // ===== マーカー認識 =====

    target.addEventListener(
      "targetFound",
      () => {

        if(started) return;

        started = true;

        // ===== 時間開始 =====

        startTime = Date.now();

        // ===== セリフ表示 =====

        messageBox.style.display =
        "block";

        // ===== ボタン非表示 =====

        linkButton.style.display =
        "none";

        // ===== セリフ開始 =====

        messageIndex = 0;

        showNextMessage();

      }
    );

    // ===== マーカー外れ =====

    target.addEventListener(
      "targetLost",
      () => {

        started = false;

        messageBox.style.display =
        "none";

        linkButton.style.display =
        "none";

        // ===== 閲覧秒数 =====

        const seconds = Math.floor(

          (Date.now() - startTime)

          / 1000

        );

        // ===== GAS送信 =====

        fetch(

          "https://script.google.com/macros/s/AKfycbyJ1Du5S-yQqG8ylXoq8i4g8YmzKlDtngqub1Sj07kiVJYb8b30HFVrvtaX6MTqL7Qf/exec",

          {

            method:"POST",

            body:JSON.stringify({

              shop:shopData.image,

              seconds:seconds,

              time:new Date().toLocaleString()

            })

          }

        );

      }
    );

  });

});

</script>

</body>
</html>
