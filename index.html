<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商店街AR案内板</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
}
</style>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
cursor="rayOrigin: mouse; fuse: false"
raycaster="objects: .clickable"
>

<a-assets>

<img id="shop1" src="shop1.png">
<img id="shop2" src="shop2.jpg">
<img id="shop3" src="shop3.jpg">

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<a-entity mindar-image-target="targetIndex: 0">

<!-- 店舗1 -->
<a-plane
id="shop1btn"
class="clickable"
src="#shop1"
position="-1.3 0 0"
width="1"
height="1.4">
</a-plane>

<!-- 店舗2 -->
<a-plane
id="shop2btn"
class="clickable"
src="#shop2"
position="0 0 0"
width="1"
height="1.4">
</a-plane>

<!-- 店舗3 -->
<a-plane
id="shop3btn"
class="clickable"
src="#shop3"
position="1.3 0 0"
width="1"
height="1.4">
</a-plane>

</a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

  // 店舗1
  const shop1 = document.querySelector("#shop1btn");

  shop1.addEventListener("click", () => {
    window.location.href =
    "https://www.iizuka-shotengai.com/dagasystem";
  });

  // 店舗2
  const shop2 = document.querySelector("#shop2btn");

  shop2.addEventListener("click", () => {
    window.location.href =
    "https://www.iizuka-shotengai.com/dagasoft";
  });

  // 店舗3
  const shop3 = document.querySelector("#shop3btn");

  shop3.addEventListener("click", () => {
    window.location.href =
    "https://www.iizuka-shotengai.com/taiyaki";
  });

});

</script>

</body>
</html>
