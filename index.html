<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>まちみっけ！</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
}

/* ===== スタート画面 ===== */

#startScreen{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  background:black;

  z-index:9999;

}

/* タイトル画像 */

#menuImage{

  width:100%;
  height:100%;

  object-fit:cover;

}

/* スタートボタン */

#startButton{

  position:absolute;

  bottom:12%;

  left:50%;

  transform:translateX(-50%);

  background:#ff6600;

  color:white;

  padding:18px 36px;

  border-radius:999px;

  font-size:28px;

  font-weight:bold;

  border:none;

  box-shadow:0 4px 10px rgba(0,0,0,0.4);

}

/* 吹き出し */

#messageBox{

  position:fixed;

  top:15%;

  left:50%;

  transform:translateX(-50%);

  background:white;

  color:black;

  padding:14px 22px;

  border-radius:20px;

  font-size:26px;

  font-weight:bold;

  z-index:999;

  min-width:260px;

  text-align:center;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

  display:none;

}

/* URLボタン */

#linkButton{

  position:fixed;

  bottom:8%;

  left:50%;

  transform:translateX(-50%);

  background:#ff6600;

  color:white;

  padding:18px 28px;

  border-radius:999px;

  font-size:24px;

  font-weight:bold;

  z-index:999;

  text-decoration:none;

  display:none;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

}

</style>

</head>

<body>

<!-- ===== スタート画面 ===== -->

<div id="startScreen">

  <!-- menu.png -->

  <img
  id="menuImage"
  src="menu.png">

  <!-- スタート -->

  <button id="startButton">

    タップしてスタート

  </button>

</div>

<!-- 吹き出し -->

<div id="messageBox"></div>

<!-- URLボタン -->

<a
id="linkButton"
href="https://www.iizuka-shotengai.com">

ここをタップしてくだされ

</a>

<!-- ===== AR ===== -->

<a-scene
id="scene"
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
style="display:none"
>

<a-assets>

<img id="shop1" src="shop1.png">

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<!-- マーカー -->

<a-entity
id="target"
mindar-image-target="targetIndex: 0">

<!-- PNG -->

<a-plane
src="#shop1"
transparent="true"
material="transparent: true"
position="0 0 0.1"
width="0.4"
height="0.6">
</a-plane>

</a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

  // ===== スタート =====

  const startButton =
  document.querySelector("#startButton");

  const startScreen =
  document.querySelector("#startScreen");

  const scene =
  document.querySelector("#scene");

  startButton.addEventListener("click", async () => {

    // スタート画面を消す

    startScreen.style.display = "none";

    // AR表示

    scene.style.display = "block";

    // MindAR開始

    const mindarSystem =
    scene.systems["mindar-image-system"];

    if(mindarSystem){

      await mindarSystem.start();

    }

  });

  // ===== 吹き出し =====

  const messageBox =
  document.querySelector("#messageBox");

  const linkButton =
  document.querySelector("#linkButton");

  const target =
  document.querySelector("#target");

  // セリフ

  const messages = [

    "ようこそ起こしなされた！",

    "私は、後ろの駄菓子屋の店主でござる！",

    "飯塚宿の紹介を少し",

    "飯塚宿は、長崎街道の宿場として",

    "大いに栄えし町にござる。",

    "異国渡りの砂糖が運ばれ、",

    "「シュガーロード」と呼ばれる",

    "菓子文化の道としても知られ、",

    "甘味文化が花開いた地でござる！",

    "今なお、その賑わいの名残は",

    "商店街に息づいておるのじゃ。",

    "それでは、",

    "商店街のお店をご案内つかまつる！",

  ];
  let messageIndex = 0;

  let started = false;

  // タイプライター

  function typeWriter(text, callback, i = 0){

    if(i <= text.length){

      messageBox.innerHTML =
      text.substring(0, i);

      setTimeout(() => {

        typeWriter(text, callback, i + 1);

      }, 120);

    } else {

      if(callback){

        callback();

      }

    }

  }

  // 次メッセージ

  function showNextMessage(){

    if(messageIndex < messages.length){

      typeWriter(messages[messageIndex], () => {

        messageIndex++;

        if(messageIndex < messages.length){

          setTimeout(() => {

            showNextMessage();

          }, 1500);

        } else {

          // 最後でボタン表示

          linkButton.style.display =
          "block";

        }

      });

    }

  }

  // マーカー認識

  target.addEventListener("targetFound", () => {

    if(started) return;

    started = true;

    messageBox.style.display = "block";

    messageIndex = 0;

    showNextMessage();

  });

  // マーカー外れた

  target.addEventListener("targetLost", () => {

    started = false;

    messageBox.style.display = "none";

    linkButton.style.display = "none";

  });

});

</script>

</body>
</html>
