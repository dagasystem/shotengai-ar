<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>まちみっけ！</title>

<style>

body{

  margin:0;
  padding:0;
  overflow:hidden;

}

/* 背景 */

#bg{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  object-fit:cover;

}

/* ボタン共通 */

.menuButton{

  position:absolute;

  left:50%;

  transform:translateX(-50%);

  width:58%;

  height:auto;

  z-index:10;

}

/* お店ボタン位置 */

#shopButton{

  top:56%;

}

/* 駐車場ボタン位置 */

#parkingButton{

  top:76%;

}

.menuButton img{

  width:100%;

  display:block;

}

</style>

</head>

<body>

<!-- 背景 -->

<img
id="bg"
src="menu_bg.png">

<!-- お店情報ボタン -->

<a
id="shopButton"
class="menuButton"
href="shop.html">

<img
src="shop_button.png">

</a>

<!-- パーキング情報ボタン -->

<a
id="parkingButton"
class="menuButton"
href="parking.html">

<img
src="parking_button.png">

</a>

</body>

</html>
