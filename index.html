<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>商店街AR案内</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
}

/* 吹き出し */

#messageBox{

  position:fixed;

  top:15%;

  left:50%;

  transform:translateX(-50%);

  background:white;

  color:black;

  padding:14px 22px;

  border-radius:20px;

  font-size:26px;

  font-weight:bold;

  z-index:999;

  min-width:260px;

  text-align:center;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

  display:none;

}

/* タップボタン */

#linkButton{

  position:fixed;

  bottom:8%;

  left:50%;

  transform:translateX(-50%);

  background:#ff6600;

  color:white;

  padding:18px 28px;

  border-radius:999px;

  font-size:24px;

  font-weight:bold;

  z-index:999;

  text-decoration:none;

  display:none;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

}

</style>

</head>

<body>

<!-- 吹き出し -->

<div id="messageBox"></div>

<!-- リンクボタン -->

<a
id="linkButton"
href="https://www.iizuka-shotengai.com">

こちらをタップしてくだされ

</a>

<a-scene
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
>

<a-assets>

<img id="shop1" src="shop1.png">

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<!-- マーカー -->

<a-entity
id="target"
mindar-image-target="targetIndex: 0">

<!-- PNG -->

<a-plane
src="#shop1"
transparent="true"
material="transparent: true"
position="0 0 0"
width="0.8"
height="1.2">
</a-plane>

</a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const messageBox =
  document.querySelector("#messageBox");

  const linkButton =
  document.querySelector("#linkButton");

  const target =
  document.querySelector("#target");

  // セリフ

  const messages = [

    "ようこそ起こしなされた！",
    
    "商店街のお店をご案内つかまつる！",

  ];

  let messageIndex = 0;

  let started = false;

  // タイプライター

  function typeWriter(text, callback, i = 0){

    if(i <= text.length){

      messageBox.innerHTML =
      text.substring(0, i);

      setTimeout(() => {

        typeWriter(text, callback, i + 1);

      }, 120);

    } else {

      if(callback){

        callback();

      }

    }

  }

  // 次メッセージ

  function showNextMessage(){

    if(messageIndex < messages.length){

      typeWriter(messages[messageIndex], () => {

        messageIndex++;

        if(messageIndex < messages.length){

          setTimeout(() => {

            showNextMessage();

          }, 1500);

        } else {

          // 最後でボタン表示

          linkButton.style.display =
          "block";

        }

      });

    }

  }

  // マーカー認識

  target.addEventListener("targetFound", () => {

    if(started) return;

    started = true;

    messageBox.style.display = "block";

    messageIndex = 0;

    showNextMessage();

  });

  // マーカー外れた

  target.addEventListener("targetLost", () => {

    started = false;

    messageBox.style.display = "none";

    linkButton.style.display = "none";

  });

});

</script>

</body>
</html>
