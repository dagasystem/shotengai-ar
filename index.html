<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>商店街AR案内板</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
}
</style>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
cursor="rayOrigin: mouse; fuse: false"
raycaster="objects: .clickable"
>

<a-assets>

<img id="shop1" src="shop1.jpg">
<img id="shop2" src="shop2.jpg">
<img id="shop3" src="shop3.jpg">

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<a-entity mindar-image-target="targetIndex: 0">

<!-- 店舗1 -->
<a-plane
id="shop1link"
class="clickable"
src="#shop1"
position="-1.2 0 0"
width="1"
height="1.4">
</a-plane>

<!-- 店舗2 -->
<a-plane
id="shop2link"
class="clickable"
src="#shop2"
position="0 0 0"
width="1"
height="1.4">
</a-plane>

<!-- 店舗3 -->
<a-plane
id="shop3link"
class="clickable"
src="#shop3"
position="1.2 0 0"
width="1"
height="1.4">
</a-plane>

</a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", function () {

  document.querySelector("#shop1link")
    .addEventListener("click", function () {
      window.open("https://www.iizuka-shotengai.com/dagasystem", "_blank");
    });

  document.querySelector("#shop2link")
    .addEventListener("click", function () {
      window.open("https://www.iizuka-shotengai.com/dagasoft", "_blank");
    });

  document.querySelector("#shop3link")
    .addEventListener("click", function () {
      window.open("https://www.iizuka-shotengai.com/taiyaki", "_blank");
    });

});

</script>

</body>
</html>
