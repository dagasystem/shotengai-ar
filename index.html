<html lang="ja">
<head>

<meta charset="UTF-8">

name="viewport"
content="width=device-width, initial-scale=1.0">

<title>まちみっけ！</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
}

/* ===== スタート画面 ===== */

#startScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:9999;
}

#menuImage{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== スタート透明ボタン ===== */

#startButton{

  position:absolute;

  bottom:10%;

  left:50%;

  transform:translateX(-50%);

  width:320px;

  height:90px;

  background:rgba(255,255,255,0);

  border:none;

}

/* ===== 終了ボタン ===== */

#closeButton{

  position:fixed;

  top:20px;

  right:20px;

  z-index:9999;

  background:black;

  color:white;

  border:none;

  border-radius:999px;

  padding:12px 18px;

  font-size:18px;

  display:none;

}

/* ===== セリフ ===== */

#messageBox{

  position:fixed;

  top:12%;

  left:50%;

  transform:translateX(-50%);

  background:white;

  color:black;

  padding:14px 22px;

  border-radius:20px;

  font-size:24px;

  font-weight:bold;

  z-index:999;

  min-width:260px;

  text-align:center;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

  display:none;

}

/* ===== URLボタン ===== */

#linkButton{

  position:fixed;

  bottom:8%;

  left:50%;

  transform:translateX(-50%);

  background:#ff6600;

  color:white;

  padding:18px 28px;

  border-radius:999px;

  font-size:24px;

  font-weight:bold;

  z-index:999;

  text-decoration:none;

  display:none;

  box-shadow:0 4px 10px rgba(0,0,0,0.3);

}

</style>

</head>

<!-- ===== スタート画面 ===== -->

<div id="startScreen">

  <img

  <button id="startButton"></button>

<!-- ===== 終了 ===== -->

終了

<!-- ===== セリフ ===== -->

<!-- ===== URL ===== -->

<a
id="linkButton"

    },

    {
      id:28,

        "商店街探索ありがとう！",
        "くわしくはこちら！"
      ]
    }

  ];

  // ===== UI =====

  const startButton =
  document.querySelector("#startButton");

  const startScreen =
  document.querySelector("#startScreen");

  const scene =
  document.querySelector("#scene");

  const closeButton =
  document.querySelector("#closeButton");

  const messageBox =
  document.querySelector("#messageBox");

  const linkButton =
  document.querySelector("#linkButton");

  // ===== START =====

  startButton.addEventListener("click", async () => {

    startScreen.style.display =
    "none";

    scene.style.display =
    "block";

    closeButton.style.display =
    "block";

    const mindarSystem =
    scene.systems["mindar-image-system"];

    if(mindarSystem){

      await mindarSystem.start();

    }

  });

  // ===== 終了 =====

  closeButton.addEventListener("click", async () => {

    const mindarSystem =
    scene.systems["mindar-image-system"];

    if(mindarSystem){

      await mindarSystem.stop();

    }

    scene.style.display =
    "none";

    startScreen.style.display =
    "block";

    closeButton.style.display =
    "none";

    messageBox.style.display =
    "none";

    linkButton.style.display =
    "none";

  });

  // ===== 店舗生成 =====

  shops.forEach((shopData) => {

    const target =
    document.createElement("a-entity");

    target.setAttribute(
      "mindar-image-target",
      `targetIndex:${shopData.id}`
    );

    // ===== PNG =====

    const plane =
    document.createElement("a-plane");

    plane.setAttribute(
      "src",
      `#${shopData.image}`
    );

    plane.setAttribute(
      "transparent",
      "true"
    );

    plane.setAttribute(
      "material",
      "transparent:true"
    );

    plane.setAttribute(
      "width",
      "0.4"
    );

    plane.setAttribute(
      "height",
      "0.6"
    );

    plane.setAttribute(
      "position",
      "0 0 0.1"
    );

    target.appendChild(plane);

    scene.appendChild(target);

    // ===== 状態 =====

    let started = false;

    let startTime = 0;

    // ===== タイプライター =====

    function typeWriter(
      text,
      callback,
      i = 0
    ){

      if(i <= text.length){

        messageBox.innerHTML =
        text.substring(0, i);

        setTimeout(() => {

          typeWriter(
            text,
            callback,
            i + 1
          );

        }, 120);

      } else {

        if(callback){

          callback();

        }

      }

    }

    // ===== セリフ順表示 =====

    let messageIndex = 0;

    function showNextMessage(){

      if(
        messageIndex
        <
        shopData.messages.length
      ){

        typeWriter(

          shopData.messages[messageIndex],

          () => {

            messageIndex++;

            if(
              messageIndex
              <
              shopData.messages.length
            ){

              setTimeout(() => {

                showNextMessage();

              }, 1500);

            }

          }

        );

      }

    }

    // ===== マーカー認識 =====

    target.addEventListener(
      "targetFound",
      () => {

        if(started) return;

        started = true;

        // ===== 開始時間 =====

        startTime = Date.now();

        messageBox.style.display =
        "block";

        messageIndex = 0;

        showNextMessage();

        linkButton.href =
        shopData.url;

        linkButton.style.display =
        "block";

      }
    );

    // ===== マーカー外れ =====

    target.addEventListener(
      "targetLost",
      () => {

        started = false;

        messageBox.style.display =
        "none";

        linkButton.style.display =
        "none";

        // ===== 閲覧秒数 =====

        const seconds = Math.floor(

          (Date.now() - startTime)

          / 1000

        );

        // ===== GAS送信 =====

        fetch(

          "https://script.google.com/macros/s/AKfycbyJ1Du5S-yQqG8ylXoq8i4g8YmzKlDtngqub1Sj07kiVJYb8b30HFVrvtaX6MTqL7Qf/exec",

          {

            method:"POST",

            body:JSON.stringify({

              shop:shopData.image,

              seconds:seconds,

              time:new Date().toLocaleString()

            })

          }

        );

      }
    );

  });

});
