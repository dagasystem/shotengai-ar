<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>まちみっけ！</title>

<style>

body{
  margin:0;
  padding:0;
  overflow:hidden;
}

#bg{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  object-fit:cover;

}

#buttons{

  position:absolute;

  bottom:8%;

  left:50%;

  transform:translateX(-50%);

  display:flex;

  flex-direction:column;

  gap:20px;

}

.menuButton{

  width:320px;

  height:90px;

  border:none;

  border-radius:20px;

  font-size:28px;

  font-weight:bold;

  color:white;

  background:#ff8c00;

}

</style>
</head>

<body>

<img
id="bg"
src="menu.png">

<div id="buttons">

  <button
  class="menuButton"
  onclick="location.href='shop.html'">

    お店情報をみる

  </button>

  <button
  class="menuButton"
  onclick="alert('準備中')">

    パーキング情報をみる

  </button>

</div>

</body>
</html>
