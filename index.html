<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商店街AR案内</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
}
</style>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
cursor="rayOrigin: mouse; fuse: false"
raycaster="objects: .clickable"
>

<a-assets>

<img id="shop1" src="shop1.png">

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<a-entity mindar-image-target="targetIndex: 0">

<!-- 店主PNG -->
<a-plane
id="shop1btn"
class="clickable"
src="#shop1"
transparent="true"
material="transparent: true"
position="0 0.2 0"
width="0.8"
height="1.2">
</a-plane>

<!-- 吹き出し背景 -->
<a-plane
color="white"
opacity="0.9"
position="0 1.0 0"
width="1.6"
height="0.45"
radius="0.05">
</a-plane>

<!-- 文字 -->
<a-text
id="message"
value=""
color="black"
align="center"
width="2"
position="0 1.0 0.01">
</a-text>

</a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

  // タップでHP
  const shop1 =
  document.querySelector("#shop1btn");

  shop1.addEventListener("click", () => {

    window.location.href =
    "https://www.iizuka-shotengai.com/dagasystem";

  });

  // メッセージ一覧
  const messages = [
    "ようこそ飯塚東町商店街に起こしなされた！",
    "商店街の各お店をご案内つかまつる！",
    "くわしくはこちらでござる！"
  ];

  const messageEl =
  document.querySelector("#message");

  let messageIndex = 0;

  function typeWriter(text, i = 0){

    if(i <= text.length){

      messageEl.setAttribute(
        "value",
        text.substring(0, i)
      );

      setTimeout(() => {
        typeWriter(text, i + 1);
      }, 120);

    } else {

      setTimeout(() => {

        messageIndex =
        (messageIndex + 1) % messages.length;

        typeWriter(
          messages[messageIndex]
        );

      }, 1500);

    }

  }

  typeWriter(messages[0]);

});

</script>

</body>
</html>
